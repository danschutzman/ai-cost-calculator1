<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TCO Estimator</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 40px;
        }
        .controls {
            flex: 1;
            min-width: 300px;
        }
        .visualization {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h2 { margin-top: 0; color: #39FF14; }
        label { display: block; margin-top: 20px; font-weight: bold; color: #aaaaaa; }
        input[type="range"] {
            width: 100%;
            margin-top: 10px;
            accent-color: #39FF14;
        }
        .value-display {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .total-cost {
            font-size: 1.5rem;
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }
        #sankey_chart {
            width: 100%;
            height: 350px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <h2>AI Cost Parameters</h2>
           
            <label>Monthly API/Tokens (Inference)</label>
            <div class="value-display">$<span id="tokenValTxt">5000</span></div>
            <input type="range" id="tokenSlider" min="0" max="50000" step="500" value="5000">

            <label>Monthly Infrastructure (Compute/Storage)</label>
            <div class="value-display">$<span id="infraValTxt">15000</span></div>
            <input type="range" id="infraSlider" min="0" max="50000" step="500" value="15000">

            <label>Monthly Governance & Tooling</label>
            <div class="value-display">$<span id="govValTxt">2000</span></div>
            <input type="range" id="govSlider" min="0" max="15000" step="500" value="2000">
        </div>

        <div class="visualization">
            <div id="sankey_chart"></div>
            <div class="total-cost">Total Monthly TCO:<br>$<span id="totalValTxt">22000</span></div>
        </div>
    </div>

    <script type="text/javascript">
        // Load the Google Sankey package
        google.charts.load('current', {'packages':['sankey']});
        google.charts.setOnLoadCallback(drawChart);

        const tokenSlider = document.getElementById('tokenSlider');
        const infraSlider = document.getElementById('infraSlider');
        const govSlider = document.getElementById('govSlider');
       
        const tokenValTxt = document.getElementById('tokenValTxt');
        const infraValTxt = document.getElementById('infraValTxt');
        const govValTxt = document.getElementById('govValTxt');
        const totalValTxt = document.getElementById('totalValTxt');

        function drawChart() {
            const tokenCost = parseInt(tokenSlider.value);
            const infraCost = parseInt(infraSlider.value);
            const govCost = parseInt(govSlider.value);
            const totalCost = tokenCost + infraCost + govCost;

            // Update text labels
            tokenValTxt.textContent = tokenCost.toLocaleString();
            infraValTxt.textContent = infraCost.toLocaleString();
            govValTxt.textContent = govCost.toLocaleString();
            totalValTxt.textContent = totalCost.toLocaleString();

            // Build Sankey Data
            var data = new google.visualization.DataTable();
            data.addColumn('string', 'From');
            data.addColumn('string', 'To');
            data.addColumn('number', 'Cost');
            data.addRows([
                ['Total AI Budget', 'API/Tokens', tokenCost || 1], // fallback to 1 to prevent chart crashing on zero
                ['Total AI Budget', 'Infrastructure', infraCost || 1],
                ['Total AI Budget', 'Governance', govCost || 1]
            ]);

            // Configure styling to match dark mode
            var options = {
                backgroundColor: 'transparent',
                sankey: {
                    node: {
                        label: { color: '#ffffff', fontSize: 14, bold: true },
                        colors: ['#ffffff', '#39FF14', '#007FFF', '#FF007F'],
                        nodePadding: 40,
                        width: 10
                    },
                    link: {
                        colorMode: 'gradient'
                    }
                }
            };

            var chart = new google.visualization.Sankey(document.getElementById('sankey_chart'));
            chart.draw(data, options);
        }

        // Add event listeners to redraw chart smoothly as sliders move
        tokenSlider.addEventListener('input', drawChart);
        infraSlider.addEventListener('input', drawChart);
        govSlider.addEventListener('input', drawChart);
    </script>
</body>
</html>
