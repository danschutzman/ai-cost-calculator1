<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TCO Estimator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            display: flex;
            gap: 40px;
        }
        .controls {
            flex: 1;
        }
        .visualization {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h2 { margin-top: 0; color: #39FF14; }
        label { display: block; margin-top: 20px; font-weight: bold; color: #aaaaaa; }
        input[type="range"] {
            width: 100%;
            margin-top: 10px;
            accent-color: #39FF14;
        }
        .value-display {
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .total-cost {
            font-size: 1.5rem;
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <h2>AI Cost Parameters</h2>
            
            <label>Monthly Token/API Spend (Inference)</label>
            <div class="value-display">$<span id="tokenVal">5000</span></div>
            <input type="range" id="tokenSlider" min="0" max="50000" step="500" value="5000">

            <label>Monthly Infrastructure (Compute/Storage)</label>
            <div class="value-display">$<span id="infraVal">15000</span></div>
            <input type="range" id="infraSlider" min="0" max="50000" step="500" value="15000">

            <label>Monthly Governance & Tooling (FinOps)</label>
            <div class="value-display">$<span id="govVal">2000</span></div>
            <input type="range" id="govSlider" min="0" max="15000" step="500" value="2000">
        </div>

        <div class="visualization">
            <canvas id="costChart"></canvas>
            <div class="total-cost">Total Monthly TCO:<br>$<span id="totalVal">22000</span></div>
        </div>
    </div>

    <script>
        const tokenSlider = document.getElementById('tokenSlider');
        const infraSlider = document.getElementById('infraSlider');
        const govSlider = document.getElementById('govSlider');
        
        const tokenVal = document.getElementById('tokenVal');
        const infraVal = document.getElementById('infraVal');
        const govVal = document.getElementById('govVal');
        const totalVal = document.getElementById('totalVal');

        const ctx = document.getElementById('costChart').getContext('2d');
        let costChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Token/API Costs', 'Infrastructure Costs', 'Governance Tools'],
                datasets: [{
                    data: [5000, 15000, 2000],
                    backgroundColor: ['#39FF14', '#007FFF', '#FF007F'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#ffffff' } }
                }
            }
        });

        function updateValues() {
            const token = parseInt(tokenSlider.value);
            const infra = parseInt(infraSlider.value);
            const gov = parseInt(govSlider.value);
            const total = token + infra + gov;

            tokenVal.textContent = token.toLocaleString();
            infraVal.textContent = infra.toLocaleString();
            govVal.textContent = gov.toLocaleString();
            totalVal.textContent = total.toLocaleString();

            costChart.data.datasets[0].data = [token, infra, gov];
            costChart.update();
        }

        tokenSlider.addEventListener('input', updateValues);
        infraSlider.addEventListener('input', updateValues);
        govSlider.addEventListener('input', updateValues);
    </script>
</body>
</html>
